<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#178b7a"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="FOOZIX Live">
  <link rel="manifest" href="manifest.webmanifest?v=3215"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-512.png">
  <link rel="stylesheet" href="app.css?v=3215"><title>FOOZIX Live — Arte Divino</title>
  <style>.foozix-orbit i{display:none!important}</style>
</head>
<body>
  <div id="offline" class="offline hidden">أنت غير متصل — Offline</div>
  <button id="install" class="install hidden">تثبيت التطبيق — Install App</button>
  <div id="installHelp" class="offline hidden">للتثبيت افتح هذه الصفحة في Chrome ثم اختر «تثبيت التطبيق». لا تحاول التثبيت من صفحة script.google.com.</div>
  <section id="brandSplash" class="brand-splash">
    <img src="icon-512.png" alt="Arte Divino" class="logo">
    <p>Powered by FOOZIX Live — Mini ERP</p>
    <div class="foozix-orbit" aria-label="Loading"><span>F</span><span>O</span><span>O</span><span>Z</span><span>I</span><span>X</span><i></i></div>
  </section>
  <main id="launcher" class="launcher hidden">
    <img src="icon-512.png" alt="Arte Divino" class="logo">
    <h1>Arte Divino</h1>
    <p>Powered by FOOZIX Live — Mini ERP</p>
    <a id="openSystem" class="open-system">فتح النظام</a>
    <button id="copySystem" class="open-system" type="button">نسخ رابط النظام — Copy System Link</button>
    <small id="openStatus" aria-live="polite"></small>
    <small>الدخول متاح فقط بالبريد المسجل والنشط داخل النظام.</small>
  </main>
  <noscript>يلزم تفعيل JavaScript لتشغيل النظام — JavaScript is required.</noscript>
  <script type="module" src="app.js?v=3215"></script>
</body>
</html>
